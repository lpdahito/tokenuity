networks:
  mongo-network:
    external: true

services:
  findPools:
    image: tokenuity-explorer
    container_name: tokenuity-findPools
    restart: always
    networks:
      - mongo-network
    environment:
      - INSTANCE_FUNCTION_TYPE=findPools
    env_file: apps/explorer/.env

  # findSwaps:
  #   image: tokenuity-explorer
  #   container_name: tokenuity-findSwaps
  #   restart: always
  #   networks:
