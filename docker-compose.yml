  #   depends_on:
  #     findPools:
  #       condition: service_started
  #   environment:
  #     - INSTANCE_FUNCTION_TYPE=findSwaps
  #   env_file: apps/explorer/.env

  findTransfers:
    image: tokenuity-explorer
    container_name: tokenuity-findTransfers
    restart: always
    networks:
      - mongo-network
    environment:
      - INSTANCE_FUNCTION_TYPE=findTransfers
    env_file: apps/explorer/.env

  computeTokenData:
    image: tokenuity-explorer
    container_name: tokenuity-computeTokenData
    restart: always
    networks:
      - mongo-network
    environment:
      - INSTANCE_FUNCTION_TYPE=computeTokenData
    env_file: apps/explorer/.env

